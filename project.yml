name: ChessDesk
options:
  bundleIdPrefix: app.chessdesk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

packages:
  ChessCore:
    path: Packages/ChessCore
  StockfishEngine:
    path: Packages/StockfishEngine

settings:
  base:
    SWIFT_VERSION: "6.0"
    # App code is UI code: everything is on the main actor unless it says
    # otherwise (Swift 6.2 default isolation). ChessCore stays nonisolated.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9ZG8RKF7RL"  # Drafted-by's Apple Developer team
    CODE_SIGN_STYLE: Automatic
    # Colours live in UI/Tokens.swift, generated names would collide.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    # Stockfish is built for arm64 (NEON): devices and Apple silicon simulators.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  configs:
    Debug:
      "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
      "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
      "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

configs:
  Debug: debug
  Release: release

targets:
  ChessDesk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: ChessDesk/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ChessDesk
        UILaunchScreen:
          UIColorName: LaunchCanvas
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - Newsreader16pt-Regular.ttf
          - Newsreader16pt-Italic.ttf
          - Newsreader16pt-Medium.ttf
          - Newsreader16pt-MediumItalic.ttf
          - Newsreader16pt-SemiBold.ttf
          - Newsreader72pt-Regular.ttf
          - Newsreader72pt-Italic.ttf
          - Newsreader72pt-Medium.ttf
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Debug builds can talk to a dev server forwarded to localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CDAPIBaseURL: $(CD_API_BASE_URL)
    sources:
      - path: ChessDesk
        excludes:
          - "**/.DS_Store"
      # Captured API answers: the offline data set of Debug builds and previews.
      - path: Fixtures
        type: folder
        buildPhase: resources
    entitlements:
      path: ChessDesk/ChessDesk.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: ChessCore
      - package: StockfishEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chessdesk.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CD_API_BASE_URL: "https://chessdesk.app"

  ChessDeskTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ChessDeskTests
      # The site's OpenAPI contract, read by ContractTests.
      - path: contracts
        type: folder
        buildPhase: resources
      # The two subscriptions, for StoreKit testing (never shipped in the app).
      - path: StoreKit/Premium.storekit
        buildPhase: resources
    dependencies:
      - target: ChessDesk
      - package: ChessCore
      - package: StockfishEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chessdesk.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ChessDesk:
    build:
      targets:
        ChessDesk: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Premium.storekit
    test:
      config: Debug
      targets:
        - ChessDeskTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
